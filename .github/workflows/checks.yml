name: Linux checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python-and-gtk:
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-gi python3-gi-cairo gir1.2-gtk-3.0 librsvg2-common fonts-noto-core xvfb dbus-x11
      - name: Validate syntax
        run: |
          /usr/bin/python3 -m compileall -q app.py ui.py progress.py gnome_backend.py install.py download_data.py scripts tests
          node --input-type=module --check < gnome-extension/extension.js
          sh -n install.sh scripts/install-deps.sh
      - name: Reading, install and D-Bus integration
        run: dbus-run-session -- /usr/bin/python3 -m unittest -v test_progress test_install test_gnome_backend
      - name: GTK X11 frontend
        run: xvfb-run -a /usr/bin/python3 -m unittest -v test_window
      - name: Build release archives
        run: /usr/bin/python3 scripts/package.py
  gnome-wayland:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install GNOME Shell and software rendering
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gnome-shell python3-gi dbus-x11 fonts-noto-core librsvg2-common libgl1-mesa-dri
      - name: Test real GNOME Wayland overlay
        env:
          JISR_RUN_GNOME_SMOKE: '1'
          JISR_TEST_OUTPUT: /tmp/jisr-gnome-test
        run: dbus-run-session -- /usr/bin/python3 tests/gnome_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gnome-wayland-test
          path: /tmp/jisr-gnome-test/
